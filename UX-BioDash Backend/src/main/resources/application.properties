spring.application.name=uxbiodash-backend
server.port=${PORT:8080}

# --- PostgreSQL 17 (local por defecto; sobrescribible por variables de entorno, p. ej. Supabase) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uxbiodash}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate: el esquema lo gestiona Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.flyway.enabled=true

# --- Carga de archivos ---
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- UX-BioDash ---
# Origenes permitidos para el frontend (separados por coma)
uxbiodash.cors.origenes-permitidos=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
# Geometria de visualizacion usada para convertir distancias a grados visuales
uxbiodash.procesamiento.distancia-visual-cm=60
uxbiodash.procesamiento.ancho-pantalla-cm=53.1
uxbiodash.procesamiento.alto-pantalla-cm=29.9
# Algoritmo I-VT
uxbiodash.procesamiento.ivt-umbral-velocidad-grados-s=30
uxbiodash.procesamiento.ivt-duracion-minima-fijacion-ms=60
uxbiodash.procesamiento.ivt-separacion-maxima-ms=75
uxbiodash.procesamiento.ivt-fusion-maxima-ms=75
uxbiodash.procesamiento.ivt-fusion-maxima-grados=0.5
# Filtro de saltos fisiologicamente imposibles
uxbiodash.procesamiento.velocidad-maxima-fisiologica-grados-s=1000
# Insercion por lotes de muestras crudas
uxbiodash.procesamiento.tamano-lote-muestras=5000
